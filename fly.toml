# fly.toml app configuration file generated for whatsapp-bot-spg on 2026-07-26
# See https://fly.io/docs/reference/configuration/ for more information

app = "whatsapp-bot-spg"
primary_region = "sin"  # Singapore region untuk latency rendah

[build]
  builder = "paketobuildpacks/builder:base"

[processes]
  app = "node index.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = 10000
  grace_period = "5s"
  method = "GET"
  path = "/health"
  timeout = 2000

[env]
  NODE_ENV = "production"

# WhatsApp bot perlu lebih banyak resources
[compute]
  memory = "1gb"
  cpus = 2

# Volume untuk simpan session data WhatsApp
[[mounts]]
  source = "whatsapp_data"
  destination = "/app/.wwebjs_auth"
